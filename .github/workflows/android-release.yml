name: Build Android Release

on:
  release:
    types: [published]

# 💡 هذه هي الإضافة التي ستحل المشكلة وتعطي صلاحية رفع الملفات (APK)
permissions:
  contents: write

jobs:
  build:
    name: Build and Upload Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. إعداد بيئة الجافا (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle 

      # 2. إعداد بيئة بايثون لتشغيل سكربت التحقق
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. تشغيل سكربت التحقق من النصوص اللغوية
      - name: Check String Parity
        run: python3 scripts/check_string_parity.py

      # 4. إعطاء صلاحيات التشغيل لأداة Gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. تشغيل الاختبارات للتأكد من سلامة الكود
      - name: Run Unit Tests
        run: ./gradlew test

      # 6. بناء الإصدار النهائي
      - name: Build Release APKs and AAR
        run: ./gradlew assembleRelease

      # 7. رفع الملفات الناتجة إلى صفحة الإصدار
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            sample/build/outputs/apk/release/*.apk
            sdk/build/outputs/aar/*.aar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
